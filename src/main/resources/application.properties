spring.application.name=banking-portal
server.servlet.context-path=/

# 1. Swapped out H2 for our real local MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/bankapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Added the new dedicated credentials we configured in the MySQL terminal
spring.datasource.username=bankuser
spring.datasource.password=BankPass123!

# 3. Updated Hibernate to use standard MySQL translation structures
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
